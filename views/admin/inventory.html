<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — OBA System</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .inv-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .inv-toolbar .search-box { flex: 1; max-width: 320px; }
    .stock-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .stock-badge.in-stock { background: var(--green-light); color: var(--green); }
    .stock-badge.low-stock { background: var(--yellow-light); color: var(--yellow-dark); }
    .stock-badge.out { background: var(--danger-light); color: var(--danger); }
    .biz-tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .biz-tag.AGRI { background: var(--yellow-light); color: var(--yellow-dark); border: 1px solid rgba(245, 197, 24, 0.3); }
    .biz-tag.NON_AGRI { background: var(--gray-100); color: var(--black-soft); border: 1px solid var(--gray-300); }
    .biz-tag.MAIN { background: var(--info-light); color: var(--info); border: 1px solid rgba(59, 130, 246, 0.3); }
    .view-only-note {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      margin-left: 12px;
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo-area">
      <img src="/images/logo.png" alt="OBA Logo" class="sidebar-logo-img">
      <div class="org-name">Office of Business Affairs</div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/admin/dashboard"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Dashboard</a>
      <a class="nav-item" href="/admin/business"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg></span> Business</a>
      <a class="nav-item active" href="/admin/inventory"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></span> Inventory</a>
      <a class="nav-item" href="/admin/all-inventory"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span> Business Inventory</a>
      <a class="nav-item" href="/admin/sales"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></span> Sales</a>
      <a class="nav-item" href="/admin/reports"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span> Reports</a>
      <a class="nav-item" href="/admin/users"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Manage Users</a>
      <a class="nav-item" href="/admin/settings"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Settings</a>
      <a class="nav-item" href="javascript:void(0)" onclick="confirm('Are you sure you want to logout?', () => window.location.href='/logout');"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> Logout</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">A</div>
        <div><div class="sidebar-user-name" id="sidebarName">Loading...</div><div class="sidebar-user-role">Logged in as:</div></div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <svg class="header-leaf-icon" width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 25C7 25 7.5 16 16.5 10.5C22 7 26 6 26 6C26 6 25 10 21.5 15.5C16 24.5 7 25 7 25Z" fill="#1b5e20"/>
          <path d="M7 25C13 19 18 14 26 6" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
          <path d="M12 25C12 25 12.5 20.5 17 17.5C20 15.5 23 15 23 15C23 15 22.5 17 20.5 20C17 25 12 25 12 25Z" fill="#22c55e"/>
        </svg>
        <span class="topbar-title">All Inventory <span class="view-only-note">VIEW ONLY</span></span>
      </div>
      <div class="topbar-actions">
        <div class="notif-bell" id="notifBell" onclick="toggleNotifDropdown()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot" id="notifDot"></span>
          <span class="notif-count" id="notifCount" style="display:none">0</span>
          <div class="notif-dropdown" id="notifDropdown"></div>
        </div>
        <button class="profile-btn"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profile <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
    </div>

    <div class="page-content">
  <!-- Movements Audit Trail Panel (view-only inspection) -->
  <div class="card" id="panelMovements">
  <div class="inv-toolbar" style="gap:12px; flex-wrap:wrap;">
  <div class="search-box">
  <input id="mSearch" class="form-control" placeholder="Search product or notes..." oninput="renderMovementsTable()">
  </div>
  <select id="mBiz" class="form-control" onchange="loadMovementsData()" style="width:auto;">
  <option value="">All Categories</option>  <option value="AGRI">Agriculture</option>
  <option value="NON_AGRI">Non-Agriculture</option>
  <option value="MAIN">Main</option>
  </select>
  <select id="mType" class="form-control" onchange="renderMovementsTable()" style="width:auto;">
  <option value="">All Movement Types</option>
  <option value="SALE_DEDUCTION">Sale Deduction</option>
  <option value="RESTOCK">Restock</option>
  <option value="MANUAL_ADJUSTMENT">Manual Adjustment</option>
  <option value="INITIAL">Initial Stock</option>
  <option value="RETURN">Return / Refund</option>
  </select>
  <input type="date" id="mStart" class="form-control" style="width:auto;" onchange="renderMovementsTable()">
  <input type="date" id="mEnd" class="form-control" style="width:auto;" onchange="renderMovementsTable()">
  <button class="btn btn-outline btn-sm" onclick="clearMovementFilters()">Clear Filters</button>
  </div>
  <div id="movementsTable">
  <div class="empty-state"><h3>No movement logs found</h3></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js?v=2"></script>
<script>
const CAT_NAMES = { AGRI:'Agriculture', NON_AGRI:'Non-Agriculture', MAIN:'Main' };

// ═══════════════════════════════════════════════════════════════════
// INVENTORY MOVEMENT HISTORY AUDIT TRAIL LOGIC (view-only inspection)
// ═══════════════════════════════════════════════════════════════════
let movements = [];

async function loadMovementsData() {
  const biz = document.getElementById('mBiz').value;
  try {
  const res = await API.get('/api/inventory/movements' + (biz ? '?biz=' + biz : ''));
  if (res.success) {
  movements = res.data || [];
  renderMovementsTable();
  }
  } catch(e) {
  document.getElementById('movementsTable').innerHTML = '<div class="empty-state"><h3>Error loading movement logs</h3></div>';
  }
}

function renderMovementsTable() {
  const search = (document.getElementById('mSearch').value || '').toLowerCase();
  const type = document.getElementById('mType').value;
  const startD = document.getElementById('mStart').value;
  const endD = document.getElementById('mEnd').value;

  let list = movements;
  if (search) {
  list = list.filter(m =>
  (m.productName || '').toLowerCase().includes(search) ||
  (m.notes || '').toLowerCase().includes(search) ||
  (m.createdBy || '').toLowerCase().includes(search)
  );
  }
  if (type) list = list.filter(m => m.type === type);
  if (startD) list = list.filter(m => (m.createdAt || '') >= startD);
  if (endD) list = list.filter(m => (m.createdAt || '') <= endD + 'T23:59:59.999Z');

  const el = document.getElementById('movementsTable');
  if (!list.length) {
  el.innerHTML = '<div class="empty-state"><h3>No inventory movement logs found</h3></div>';
  return;
  }

  const badgeMap = {
  SALE_DEDUCTION: '<span class="stock-badge out">Sale Deduction</span>',
  RESTOCK: '<span class="stock-badge in-stock">Restock</span>',
  MANUAL_ADJUSTMENT: '<span class="stock-badge low-stock">Manual Adjustment</span>',
  INITIAL: '<span class="stock-badge in-stock">Initial Stock</span>',
  RETURN: '<span class="stock-badge in-stock">Return / Refund</span>'
  };

  el.innerHTML = `<table>
  <thead>
  <tr>
  <th>Date & Time</th>
  <th>Product</th>
  <th>Category</th>
  <th>Type</th>
  <th>Qty Change</th>
  <th>Stock Shift</th>
  <th>Performed By</th>
  <th>Notes / Reason</th>
  </tr>
  </thead>
  <tbody>
  ${list.map(m => {
  const changeStr = m.quantityChange > 0 ? `+${m.quantityChange}` : `${m.quantityChange}`;
  const changeCls = m.quantityChange > 0 ? 'text-green fw-bold' : 'color:var(--danger);font-weight:bold';
  const dStr = m.createdAt ? new Date(m.createdAt).toLocaleString('en-PH') : '—';
  return `<tr>
  <td style="font-size:0.8rem">${dStr}</td>
  <td class="fw-bold">${m.productName || m.productId || '—'}</td>
  <td><span class="biz-tag ${m.businessCategory}">${CAT_NAMES[m.businessCategory] || m.businessCategory}</span></td>
  <td>${badgeMap[m.type] || `<span class="stock-badge">${m.type}</span>`}</td>
  <td style="${changeCls}">${changeStr}</td>
  <td>${m.previousStock !== undefined ? `${m.previousStock} → ${m.newStock}` : '—'}</td>
  <td style="font-size:0.82rem">${m.createdBy || '—'}</td>
  <td style="font-size:0.82rem; max-width:220px">${m.notes || '—'}</td>
  </tr>`;
  }).join('')}
  </tbody>
  </table>`;
}

function clearMovementFilters() {
  ['mSearch', 'mType', 'mStart', 'mEnd'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.value = '';
  });
  // Reset the category dropdown too, and re-fetch data since the biz
  // filter is applied server-side (movements array is fetched by category)
  const bizSel = document.getElementById('mBiz');
  if (bizSel) bizSel.value = '';
  loadMovementsData();
}

document.addEventListener('DOMContentLoaded', () => {
  loadMovementsData();
  getCurrentUser().then(u => {
    if (u) {
      document.getElementById('sidebarName').textContent = u.name;
      document.querySelector('.sidebar-user-role').textContent = 'Logged in as: ' + formatRole(u.role);
      document.getElementById('sidebarAvatar').textContent = u.name.charAt(0).toUpperCase();
    }
  });
});
</script>
</body>
</html>
