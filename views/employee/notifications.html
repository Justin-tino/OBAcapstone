<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notifications — OBA System</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .notif-page-list { max-height: none; }
    .notif-page-item { display: flex; align-items: start; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--gray-200); transition: background 0.2s; }
    .notif-page-item:last-child { border-bottom: none; }
    .notif-page-item .np-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .notif-page-item .np-info { flex: 1; }
    .notif-page-item .np-title { font-weight: 600; font-size: 0.9rem; }
    .notif-page-item .np-msg { font-size: 0.82rem; color: var(--gray-600); margin-top: 2px; }
    .notif-page-item .np-time { font-size: 0.72rem; color: var(--gray-400); margin-top: 4px; }
    .notif-page-item .np-priority { display: inline-block; padding: 1px 8px; border-radius: 8px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
    .notif-page-item .np-priority.critical { background: #fce4e4; color: #c0392b; }
    .notif-page-item .np-priority.warning { background: #fef5e7; color: #d4a017; }
    .notif-page-item .np-priority.info { background: #e8f5e9; color: #2d6a2e; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo-area">
      <img src="/images/logo.png" alt="OBA Logo" class="sidebar-logo-img">
      <div class="org-name">Office of Business Affairs</div>
    </div>
    <nav class="sidebar-nav" id="empNav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">E</div>
        <div><div class="sidebar-user-name" id="sidebarName">Loading...</div><div class="sidebar-user-role">Logged in as:</div></div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar topbar-green">
      <div class="flex-c gap-12">
        <span class="topbar-title">My Notifications</span>
      </div>
      <div class="topbar-actions">
        <button class="profile-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg> Profile</button>
      </div>
    </div>

    <div class="page-content">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--gray-200);flex-wrap:wrap;gap:10px">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <div>
              <span class="card-title" style="font-size:1.1rem;font-weight:700">My Business Notifications</span>
              <span id="notifCountBadge" style="background:var(--green);color:#fff;padding:2px 12px;border-radius:12px;font-size:0.78rem;font-weight:600;margin-left:8px">0</span>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteAllNotifs()" style="margin-left:auto"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align:-2px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Delete All</button>
          </div>
        </div>
        <div id="notifList" style="padding:0 16px">
          <div class="empty-state"><h3>Loading notifications...</h3></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js?v=2"></script>
<script>
let BIZ = 'AGRI';

function buildNav() {
  const q = workspaceQuery(BIZ, getWorkspace().entity);
  document.getElementById('empNav').innerHTML = `
    <a class="nav-item" href="/employee/dashboard${q}"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Dashboard</a>
    <a class="nav-item" href="/employee/inventory${q}"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></span> Inventory</a>
    <a class="nav-item" href="/employee/pos${q}"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span> POS</a>
    <a class="nav-item" href="/employee/reports${q}"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span> Generate Report</a>
    <a class="nav-item" href="javascript:void(0)" onclick="confirm('Are you sure you want to logout?', () => window.location.href='/logout');"><span class="nav-icon"><svg width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> Logout</a>
  `;
}

const ICONS = {
  low_stock: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  high_stock: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  out_of_stock: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  normal_stock: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  restock: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
  inventory: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
  sale: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>',
  sale_completed: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  message: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  system: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
};

async function loadNotifications() {
  try {
    // Scope the feed to the CURRENT business workspace (?biz=&entity=) so
    // notifications from other businesses never leak into this one.
    const ws = getWorkspace();
    let url = '/api/employee/notifications?biz=' + encodeURIComponent(BIZ || ws.biz || 'AGRI');
    if (ws.entity) url += '&entity=' + encodeURIComponent(ws.entity);
    const res = await API.get(url);
    if (!res.success) return;
    const notifs = (res.data || []).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    const el = document.getElementById('notifList');
    document.getElementById('notifCountBadge').textContent = notifs.length;
    if (!notifs.length) {
      el.innerHTML = '<div class="empty-state"><h3>No available notifications</h3><p>You have no alerts for your business yet.</p></div>';
      return;
    }
    el.innerHTML = '<div class="notif-page-list">' + notifs.map(n => {
      const icon = ICONS[n.type] || ICONS.system;
      const priority = n.priority || 'info';
      const iconBg = priority === 'critical' ? '#fce4e4' : priority === 'warning' ? '#fef5e7' : '#e8f5e9';
      const iconColor = priority === 'critical' ? '#c0392b' : priority === 'warning' ? '#d4a017' : '#2d6a2e';
      return `<div class="notif-page-item" style="${n.isRead ? '' : 'background:#f6faf6;border-radius:8px;padding-left:10px;padding-right:10px'}">
        <div class="np-icon" style="background:${iconBg};color:${iconColor}">${icon}</div>
        <div class="np-info">
          <div class="np-title">${n.title || 'Notification'} ${n.isRead ? '' : '<span style="background:var(--green);color:#fff;font-size:0.6rem;padding:1px 6px;border-radius:8px;vertical-align:middle">NEW</span>'}</div>
          <div class="np-msg">${n.message || ''}</div>
          <div class="np-time"><span class="np-priority ${priority}">${priority}</span> ${n.createdAt ? new Date(n.createdAt).toLocaleString() : ''} by ${n.createdByName || n.createdBy || 'system'}</div>
        </div>
        <button title="Delete notification" onclick="deleteNotif('${n.id}')" style="background:none;border:none;cursor:pointer;color:#94a3b8;padding:6px;border-radius:6px;align-self:center;flex-shrink:0" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#94a3b8'">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>`;
    }).join('') + '</div>';
  } catch(e) {
    document.getElementById('notifList').innerHTML = '<div class="empty-state"><h3>Unable to load notifications</h3></div>';
  }
}

// ── Delete notifications ──────────────────────────────────────────
function notifFeedQuery() {
  const ws = getWorkspace();
  let q = '?biz=' + encodeURIComponent(BIZ || ws.biz || 'AGRI');
  if (ws.entity) q += '&entity=' + encodeURIComponent(ws.entity);
  return q;
}

async function deleteNotif(id) {
  confirm('Delete this notification?', async () => {
    try {
      await API.del('/api/employee/notifications/' + id);
      loadNotifications();
      Toast.success('Notification deleted');
    } catch(e) { Toast.error('Failed to delete notification'); }
  });
}

async function deleteAllNotifs() {
  confirm('Delete ALL notifications for this business? This cannot be undone.', async () => {
    try {
      await API.del('/api/employee/notifications' + notifFeedQuery());
      loadNotifications();
      Toast.success('All notifications deleted');
    } catch(e) { Toast.error('Failed to delete notifications'); }
  });
}

async function initPage() {
  const u = await getCurrentUser();
  if (u) {
    const bizAccess = u.businessAccess || [];
    BIZ = getBizId() || (bizAccess.includes('all') ? 'AGRI' : (bizAccess[0] || 'AGRI'));
    document.getElementById('sidebarName').textContent = u.name;
    document.querySelector('.sidebar-user-role').textContent = 'Logged in as: ' + formatRole(u.role);
    document.getElementById('sidebarAvatar').textContent = u.name.charAt(0).toUpperCase();
  }
  buildNav();
  loadNotifications();
}

document.addEventListener('DOMContentLoaded', initPage);
</script>
</body>
</html>
